server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Same-origin API: browser -> nginx -> api-gateway (cookies + no CORS needed)
    location /api/ {
        proxy_pass http://api-gateway:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: send unknown paths to index.html
    location / {
        try_files $uri /index.html;
    }
}
