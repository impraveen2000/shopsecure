server:
  port: 18090

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:18888}
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-secret}
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 15s
      # Only needed if the browser calls the gateway directly from another origin.
      # With the Vite dev proxy / nginx the frontend is same-origin and CORS is not used.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:15173}
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # Global rate limit: 20 req/s per user (or per IP when anonymous), bursts up to 40
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@userOrIpKeyResolver}"
      routes:
        - id: auth-service
          uri: lb://auth-service          # lb:// = look up instances in Eureka and load-balance
          predicates:
            - Path=/api/auth/**
          filters:
            # Much stricter limit on auth endpoints: slows down brute-force / credential stuffing
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@loginIpKeyResolver}"

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productCircuitBreaker
                fallbackUri: forward:/fallback/products

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/orders

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 1s
      connect-timeout: 1s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka-secret@localhost:18761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

app:
  jwt:
    issuer: shopsecure-auth
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:18081/.well-known/jwks.json}
