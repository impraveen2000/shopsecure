server:
  port: 18081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:18888}
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-secret}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/authdb}
    username: ${DB_USER:shopsecure}
    password: ${DB_PASSWORD:shopsecure}
  jpa:
    hibernate:
      ddl-auto: update        # use Flyway/Liquibase migrations in real projects
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # consumers live in other services/packages
        max.block.ms: 5000                     # don't hang forever if Kafka is down

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka-secret@localhost:18761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

app:
  jwt:
    issuer: shopsecure-auth
    access-token-ttl: 15m        # short-lived: limits damage if stolen
    refresh-token-ttl: 7d        # long-lived but stored HttpOnly + rotated + revocable
    service-token-ttl: 5m
  security:
    max-failed-attempts: 5
    lock-duration: 15m
    cookie-secure: ${COOKIE_SECURE:false}   # MUST be true in production (HTTPS only)
  # Machine clients allowed to use the client-credentials style /service-token endpoint
  service-clients:
    order-service: ${ORDER_SERVICE_SECRET:order-service-secret}
  admin:
    username: admin
    email: admin@shopsecure.dev
    password: ${ADMIN_PASSWORD:Admin@123}
